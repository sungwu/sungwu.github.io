{{- $orig := false }}
{{- range .Translations }}{{ if eq .Lang "ko" }}{{ $orig = . }}{{ end }}{{ end }}
<p class="notice" role="note">
  {{ T "translatedNotice" }}
  {{- with .Params.source_lastmod }} {{ T "originalUpdated" }} {{ . }}.{{ end }}
  {{- with $orig }} <a href="{{ .RelPermalink }}" hreflang="ko">{{ T "readOriginal" }}</a>{{ end }}
</p>
